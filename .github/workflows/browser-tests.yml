name: Browser regression tests

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/browser-tests.yml
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/browser-tests.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Check UI, labels and dropdowns
        run: python tests/ui_smoke.py
      - name: Check tournament safety
        run: python tests/safety.py
      - name: Rehearse tournament brackets
        run: python tests/rehearsal.py
