name: Browser regression tests

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app/**
      - server/**
      - functions/**
      - contracts/**
      - tools/**
      - tests/**
      - .github/workflows/browser-tests.yml
      - supabase/**
  pull_request:
    paths:
      - index.html
      - app/**
      - server/**
      - functions/**
      - contracts/**
      - tools/**
      - tests/**
      - .github/workflows/browser-tests.yml
      - supabase/**
  workflow_dispatch:

# A newer PR update supersedes stale in-progress UI or full checks.
concurrency:
  group: browser-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Select safe CI lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.impact.outputs.lane }}
    steps:
      - name: Checkout PR head and history for reliable push-range comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test CI routing safeguards (no network)
        run: python3 -m unittest discover -s tests -p 'test_ci_impact.py' -v
      - name: Classify the complete incremental push (fail closed)
        id: impact
        env:
          EVENT_ACTION: ${{ github.event.action }}
          SYNC_BEFORE: ${{ github.event.before }}
          SYNC_AFTER: ${{ github.event.after }}
        run: python3 tools/ci_impact.py

  ui-targeted:
    name: Fast UI checks (fictional Chrome)
    needs: classify
    if: needs.classify.outputs.lane == 'ui-visual' || needs.classify.outputs.lane == 'ui-interaction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout precise PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install isolated browser fixtures
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright-core install chromium
      - name: Syntax sanity (no network)
        run: |
          node --check app/view_players.mjs
          node --check app/view_registration.mjs
      - name: Focused phone/desktop UI regression (no hosted requests)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_fast_ui_browser.test.mjs
      - name: Registration and check-in workflow (when organizer UI code changes)
        if: needs.classify.outputs.lane == 'ui-interaction'
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_registration_browser.test.mjs
      - name: Google mapping and privacy workflow (when organizer UI code changes)
        if: needs.classify.outputs.lane == 'ui-interaction'
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_launch_google_browser.test.mjs

  foundation:
    name: Full regression — browser and security foundation
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Check Phase 1A shared-event reference contract
        run: python -m unittest discover -s tests -p 'test_phase1a_contract.py' -v
      - name: Check consolidated synthetic Milestone 1 JavaScript safeguards (zero network)
        run: node --test tests/phase1c*.test.mjs tests/milestone1_*.test.mjs
      - name: Check unapplied Milestone 1 SQL safety proposal (static only)
        run: python -m unittest discover -s tests -p 'test_milestone1_v2_proposal.py' -v
      - name: Verify one-time hosted operator source guards (offline only)
        run: python -m unittest discover -s tests -p 'test_milestone1_v2_hosted_once.py' -v
      - name: Verify connected two-browser synthetic Match Desk and outsider denial
        run: python tests/milestone1_connected_browser.py
      - name: Verify synthetic two-scorekeeper score/recovery lab and protected fallback (zero network)
        run: python tests/milestone1_score_lab_browser.py
      - name: Verify guarded hosted browser operator source and exclusive incident marker (offline only)
        run: python -m unittest discover -s tests -p 'test_milestone1_hosted_browser_once.py' -v
      - name: Verify two Chromium signed browser contexts, lost ACK, stale rejection and tab recovery (mocked host)
        run: python tests/milestone1_hosted_browser_mock.py
      - name: Verify synthetic three-context spectator/staff read-only following and fail-closed privacy (mock host)
        run: python tests/milestone1_live_read_browser.py
      - name: Verify browser-only organizer continuity training drill (zero network)
        run: python tests/milestone1_continuity_browser.py
      - name: Verify organizer fallback operations rehearsal, stand-down evidence and manual reconciliation (zero network)
        run: python tests/milestone1_fallback_ops_browser.py
      - name: Verify TV/projector board freshness, stale labelling, recovery and private-field rejection (mock host, controlled clock)
        run: python tests/milestone1_tv_display_browser.py
      - name: Verify physical-device staff page origin gating, suspend/resume and revocation (intercepted provider, fake origins)
        run: python tests/milestone1_device_staff_browser.py
      - name: Verify device readiness page and origin policy (zero network)
        run: python tests/milestone1_device_check_browser.py
      - name: Verify two signed PKCE staff browser profiles, outsider, revocation and callback tampering (fully intercepted mock)
        run: python tests/milestone1_pkce_staff_browser.py
      - name: Verify email/password staff login page, rate limits, persistence, background, revocation and recovery code (intercepted provider, fake origins)
        run: python tests/milestone1_staff_login_browser.py
      - name: Verify sanitized staging export builder, headers and origin refusals (offline, publishes nothing)
        run: python -m unittest discover -s tests -p 'test_staging_export.py' -v
      - name: Verify the automatic staging release pipeline's decisions and staging-only boundaries (offline, deploys nothing)
        run: python -m unittest discover -s tests -p 'test_staging_release.py' -v
      - name: Check UI, labels and dropdowns
        run: python tests/ui_smoke.py
      - name: Check tournament safety
        run: python tests/safety.py
      - name: Rehearse tournament brackets
        run: python tests/rehearsal.py


  test:
    name: Full regression — game-day and launch workflows
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Game-day client, session, exports, formats, sign-in discovery and public-model unit tests (zero network)
        run: node --test tests/gameday_*.test.mjs
      - name: FFTT3 Bracket Manager role and production origin checks (zero network)
        run: node --test tests/fftt3_bracket_manager_role.test.mjs
      - name: Registration model and server-side adapter (mocked Google and Supabase, zero network)
        run: node --test tests/registration_*.test.mjs
      - name: Install test-only local PostgreSQL (WebAssembly) and browser driver
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright-core install chromium
      - name: Verify offline real-event SQL candidate in separate PGlite instance (fictional only, never deployed)
        run: node --test tests/e2e/gameday_real_event_candidate.test.mjs
      - name: In-place FFTT3 single-project migration proof on populated synthetic DB (zero hosted traffic)
        run: node --test tests/e2e/gameday_single_project_upgrade.test.mjs
      - name: Game-day server logic against the real SQL (local PostgreSQL), parity with the approved engine
        run: node --test tests/e2e/gameday_server.test.mjs
      - name: Game-day real client stack (session, API, score transport, core) against the real SQL
        run: node --test tests/e2e/gameday_core.test.mjs
      - name: V4 server logic against the real SQL (formats incl. historical Bo5, registration, restore, guarded deletion)
        run: node --test tests/e2e/gameday_v4_server.test.mjs
      - name: V4 real client stack (stale formats, duplicate sends, registration privacy lifecycle, events) and adapter authorization against the real SQL
        run: node --test tests/e2e/gameday_v4_core.test.mjs tests/e2e/registration_integration.test.mjs
      - name: Game-day browser rehearsal (organizer, two scorekeepers, spectator, TV, outsider; isolated Chromium contexts)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_browser.test.mjs
      - name: Game-day browser failure paths (background/resume, outage, stale TV, reload, renewal, wrong password)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_browser_failures.test.mjs
      - name: V4 browser - formats on every surface and historical Best of 5 (isolated Chromium contexts)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_v4_browser.test.mjs
      - name: V4 browser - registration, check-in, duplicates, walk-ins, CSV fallback, input persistence
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_registration_browser.test.mjs
      - name: V4 browser - sign-in by event name, event filters, archive, restore, guarded deletion
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_events_browser.test.mjs
      - name: V5 event-specific registration source against the real SQL (organizer-only, event-scoped, synthetic rule, status, audit, cascade)
        run: node --test tests/e2e/gameday_v5_server.test.mjs
      - name: UI/UX polish in real Chrome - spacing system, password toggle, score tiles, Overview layout, notifications, Registration settings (fake Google)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_polish_browser.test.mjs
      - name: V4 browser - responsive layout, accessibility (axe-core), keyboard and tap targets
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_ui_audit.test.mjs
      - name: LAUNCH MODE - server, client stack and V4 logic on the UPGRADED single-project schema with real-mode events (scoring, formats, brackets, tables, consolation, doubles, recovery)
        env:
          FFTT_UPGRADED: '1'
        run: node --test tests/e2e/gameday_server.test.mjs tests/e2e/gameday_core.test.mjs tests/e2e/gameday_v4_server.test.mjs tests/e2e/gameday_v4_core.test.mjs
      - name: LAUNCH MODE - browser rehearsal, failures, formats and events on a real-mode event (organizer, two scorekeepers, spectator, TV, outsider)
        env:
          FFTT_CHROME_CHANNEL: none
          FFTT_UPGRADED: '1'
        run: node --test tests/e2e/gameday_browser.test.mjs tests/e2e/gameday_browser_failures.test.mjs tests/e2e/gameday_v4_browser.test.mjs tests/e2e/gameday_events_browser.test.mjs
      - name: LAUNCH MODE - Google Sheets registration on a real-mode event (fake Google; organizer-only, allowlist, full names, no contact leakage)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_launch_google_browser.test.mjs
      - name: LAUNCH MODE - long full names on staff, spectator and TV (no overflow or clipped names; same first names stay distinguishable)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_fullnames_layout.test.mjs
      - name: Backup export, disposable restore, in-place upgrade and rollback rehearsal (fictional data; tampering must fail)
        run: node --test tests/e2e/ops_restore_rehearsal.test.mjs

  disposable-db:
    name: Disposable synthetic PostgreSQL
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Supabase CLI (local only)
        uses: supabase/setup-cli@v3
        with:
          version: 2.79.0
      - name: Start isolated local Supabase PostgreSQL and GoTrue (no remote link)
        run: supabase start
      - name: Verify existing B1-B2d migrations before v2
        run: supabase test db
      - name: Apply v2 candidate ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/MILESTONE1_DURABLE_SCORING_V2_DO_NOT_APPLY.sql
      - name: Assert real PostgreSQL accepted/rejected receipt and revocation behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/milestone1_v2_disposable.sql
      - name: Verify independently signed local Auth and simultaneous V2 HTTP score race
        run: |
          python -m py_compile tests/milestone1_v2_signed_http.py
          python tests/milestone1_v2_signed_http.py
      - name: Apply game-day V3 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V3_STAGING.sql
      - name: Assert game-day V3 privileges (anon/authenticated/private helpers)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v3_disposable.sql
      - name: Verify a whole fictional tournament over real local Auth with concurrent scorekeepers
        run: |
          python -m py_compile tests/gameday_signed_http.py
          python tests/gameday_signed_http.py
      - name: Apply game-day V4 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V4_STAGING.sql
      - name: Assert game-day V4 privileges and structure (anon/authenticated/private helpers/contact columns/Bo5)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v4_disposable.sql
      - name: Verify V4 formats, registration, restore and guarded deletion over real local Auth with concurrent scorekeepers
        run: |
          python -m py_compile tests/gameday_v4_signed_http.py
          python tests/gameday_v4_signed_http.py
      - name: Apply game-day V5 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V5_STAGING.sql
      - name: Independently test real-only candidate on disposable local PostgreSQL (fictional users only)
        env:
          PGPASSWORD: postgres
        run: bash tests/gameday_real_candidate_postgres.sh
      - name: Validate in-place real-event launch upgrade on populated local PostgreSQL (no hosted change)
        env:
          PGPASSWORD: postgres
        run: bash tests/gameday_single_project_postgres.sh
      - name: Assert game-day V5 privileges and structure (anon/authenticated/helpers/no private data/synthetic rule)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v5_disposable.sql
      - name: Apply source-pinned single-project launch candidate to disposable local Supabase only
        env:
          PGPASSWORD: postgres
        run: |
          candidate="$(mktemp)"
          rm -f "$candidate"
          trap 'rm -f "$candidate"' EXIT
          python3 tools/release/build_single_project_upgrade.py --out "$candidate"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "$candidate" >/dev/null
      - name: Verify real-mode event with independent local signed Auth, two scorer race and private registration
        run: |
          python -m py_compile tests/fftt3_launch_signed_http.py
          python tests/fftt3_launch_signed_http.py
