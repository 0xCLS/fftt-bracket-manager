name: Browser regression tests

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app/**
      - contracts/**
      - tools/**
      - tests/**
      - .github/workflows/browser-tests.yml
      - supabase/**
  pull_request:
    paths:
      - index.html
      - app/**
      - contracts/**
      - tools/**
      - tests/**
      - .github/workflows/browser-tests.yml
      - supabase/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Check Phase 1A shared-event reference contract
        run: python -m unittest discover -s tests -p 'test_phase1a_contract.py' -v
      - name: Check consolidated synthetic Milestone 1 JavaScript safeguards (zero network)
        run: node --test tests/phase1c*.test.mjs tests/milestone1_*.test.mjs
      - name: Check unapplied Milestone 1 SQL safety proposal (static only)
        run: python -m unittest discover -s tests -p 'test_milestone1_v2_proposal.py' -v
      - name: Verify one-time hosted operator source guards (offline only)
        run: python -m unittest discover -s tests -p 'test_milestone1_v2_hosted_once.py' -v
      - name: Verify connected two-browser synthetic Match Desk and outsider denial
        run: python tests/milestone1_connected_browser.py
      - name: Verify synthetic two-scorekeeper score/recovery lab and protected fallback (zero network)
        run: python tests/milestone1_score_lab_browser.py
      - name: Verify guarded hosted browser operator source and exclusive incident marker (offline only)
        run: python -m unittest discover -s tests -p 'test_milestone1_hosted_browser_once.py' -v
      - name: Verify two Chromium signed browser contexts, lost ACK, stale rejection and tab recovery (mocked host)
        run: python tests/milestone1_hosted_browser_mock.py
      - name: Verify synthetic three-context spectator/staff read-only following and fail-closed privacy (mock host)
        run: python tests/milestone1_live_read_browser.py
      - name: Verify browser-only organizer continuity training drill (zero network)
        run: python tests/milestone1_continuity_browser.py
      - name: Verify organizer fallback operations rehearsal, stand-down evidence and manual reconciliation (zero network)
        run: python tests/milestone1_fallback_ops_browser.py
      - name: Verify TV/projector board freshness, stale labelling, recovery and private-field rejection (mock host, controlled clock)
        run: python tests/milestone1_tv_display_browser.py
      - name: Verify physical-device staff page origin gating, suspend/resume and revocation (intercepted provider, fake origins)
        run: python tests/milestone1_device_staff_browser.py
      - name: Verify device readiness page and origin policy (zero network)
        run: python tests/milestone1_device_check_browser.py
      - name: Verify two signed PKCE staff browser profiles, outsider, revocation and callback tampering (fully intercepted mock)
        run: python tests/milestone1_pkce_staff_browser.py
      - name: Verify email/password staff login page, rate limits, persistence, background, revocation and recovery code (intercepted provider, fake origins)
        run: python tests/milestone1_staff_login_browser.py
      - name: Verify sanitized staging export builder, headers and origin refusals (offline, publishes nothing)
        run: python -m unittest discover -s tests -p 'test_staging_export.py' -v
      - name: Game-day client, session, exports and public-model unit tests (zero network)
        run: node --test tests/gameday_*.test.mjs
      - name: Install test-only local PostgreSQL (WebAssembly) and browser driver
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright-core install chromium
      - name: Game-day server logic against the real SQL (local PostgreSQL), parity with the approved engine
        run: node --test tests/e2e/gameday_server.test.mjs
      - name: Game-day real client stack (session, API, score transport, core) against the real SQL
        run: node --test tests/e2e/gameday_core.test.mjs
      - name: Game-day browser rehearsal (organizer, two scorekeepers, spectator, TV, outsider; isolated Chromium contexts)
        env:
          FFTT_CHROME_CHANNEL: none
        run: node --test tests/e2e/gameday_browser.test.mjs
      - name: Check UI, labels and dropdowns
        run: python tests/ui_smoke.py
      - name: Check tournament safety
        run: python tests/safety.py
      - name: Rehearse tournament brackets
        run: python tests/rehearsal.py

  disposable-db:
    name: Disposable synthetic PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Supabase CLI (local only)
        uses: supabase/setup-cli@v3
        with:
          version: 2.79.0
      - name: Start isolated local Supabase PostgreSQL and GoTrue (no remote link)
        run: supabase start
      - name: Verify existing B1-B2d migrations before v2
        run: supabase test db
      - name: Apply v2 candidate ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/MILESTONE1_DURABLE_SCORING_V2_DO_NOT_APPLY.sql
      - name: Assert real PostgreSQL accepted/rejected receipt and revocation behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/milestone1_v2_disposable.sql
      - name: Apply game-day V3 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V3_STAGING.sql
      - name: Assert game-day V3 privileges (anon/authenticated/private helpers)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v3_disposable.sql
      - name: Verify a whole fictional tournament over real local Auth with concurrent scorekeepers
        run: |
          python -m py_compile tests/gameday_signed_http.py
          python tests/gameday_signed_http.py
      - name: Verify independently signed local Auth and simultaneous V2 HTTP score race
        run: |
          python -m py_compile tests/milestone1_v2_signed_http.py
          python tests/milestone1_v2_signed_http.py
