name: B2c Supabase Auth integration

on:
  pull_request:
    paths:
      - tests/b2c_auth_concurrency.py
      - supabase/**
      - .github/workflows/b2c-auth-concurrency.yml
  workflow_dispatch:

jobs:
  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Validate synthetic integration test syntax and CLI availability
        run: |
          python -m py_compile tests/b2c_auth_concurrency.py
          command -v psql
          supabase start --help >/dev/null
      - name: Start isolated local Supabase
        run: supabase start >/dev/null
      - name: Validate PostgreSQL migrations and tests
        run: supabase test db
      - name: Test signed synthetic Auth sessions and conflicting HTTP requests
        run: python tests/b2c_auth_concurrency.py
