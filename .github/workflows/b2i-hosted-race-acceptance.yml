name: B2i offline hosted-score race acceptance guards

on:
  pull_request:
    paths:
      - tests/b2i_hosted_race_oracle.py
      - tests/test_b2i_hosted_race_oracle.py
      - tests/b2i_hosted_race_operator_DISABLED.py
      - tests/test_b2i_hosted_race_operator_DISABLED.py
      - tests/b2i_hosted_race_operator_APPROVED.py
      - tests/test_b2i_hosted_race_operator_APPROVED.py
      - docs/PHASE1B_B2I_HOSTED_SCORE_RACE.md
      - .github/workflows/b2i-hosted-race-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pure B2i acceptance validator
        run: python -m py_compile tests/b2i_hosted_race_oracle.py tests/test_b2i_hosted_race_oracle.py tests/b2i_hosted_race_operator_DISABLED.py tests/test_b2i_hosted_race_operator_DISABLED.py tests/b2i_hosted_race_operator_APPROVED.py tests/test_b2i_hosted_race_operator_APPROVED.py
      - name: Test fail-closed race and independent persisted-state evidence
        run: |
          python -m unittest discover -s tests -p 'test_b2i_hosted_race_oracle.py' -v
          python -m unittest discover -s tests -p 'test_b2i_hosted_race_operator_DISABLED.py' -v
          python -m unittest discover -s tests -p 'test_b2i_hosted_race_operator_APPROVED.py' -v
