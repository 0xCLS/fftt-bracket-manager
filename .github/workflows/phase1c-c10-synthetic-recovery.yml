name: C10 synthetic recovery planner tests
on:
  push:
    branches: [phase1c/c10-synthetic-recovery-planner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mock-only recovery and previous milestone contracts
        run: node --test tests/phase1c_disconnect_reference.test.mjs tests/phase1c_c5_snapshot_wire.test.mjs tests/phase1c_c9_independent_roles.test.mjs tests/phase1c_c10_recovery_plan.test.mjs
