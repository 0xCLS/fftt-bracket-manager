name: Synthetic database security tests

on:
  pull_request:
    paths:
      - supabase/**
      - .github/workflows/database-tests.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/database-tests.yml
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start isolated synthetic PostgreSQL (no remote link)
        run: supabase db start
      - name: Apply pgTAP privilege and projection assertions
        run: supabase test db
