name: Render social preview image

on:
  push:
    branches: [main]
    paths:
      - assets/fftt-bracket-manager-og-v2-source.png
      - .github/workflows/render-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image renderer
        run: npm install --no-save --package-lock=false sharp@0.34.4
      - name: Create sharp, branded PNG for social-media crawlers
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const source = 'assets/fftt-bracket-manager-og-v2-source.png';
            const target = 'assets/fftt-bracket-manager-og-v2.png';
            const input = await sharp(source).metadata();
            if(input.format !== 'png' || input.width !== 1731 || input.height !== 909) {
              throw new Error('Unexpected full-resolution approved source');
            }
            await sharp(source).resize(1200, 630, {
              fit: 'fill', kernel: 'lanczos3'
            }).png({compressionLevel:9}).toFile(target);
            const info = await sharp(target).metadata();
            if(info.format !== 'png' || info.width !== 1200 || info.height !== 630) {
              throw new Error('Social card dimensions incorrect');
            }
            const region = await sharp(target).extract({
              left:160, top:220, width:172, height:170
            }).removeAlpha().raw().toBuffer({resolveWithObject:true});
            let sum = 0;
            for(let i = 0; i < region.data.length; i += region.info.channels) {
              sum += region.data[i] + region.data[i+1] + region.data[i+2];
            }
            const rgbMean = sum / region.data.length;
            if(rgbMean > 175) {
              throw new Error('Approved FFTT emblem is missing or too faint: '+rgbMean);
            }
            console.log('Share image verified:',info.width,info.height,'logo mean RGB',rgbMean.toFixed(1));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Commit rendered preview if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fftt-bracket-manager-og-v2.png
          if git diff --cached --quiet; then
            echo 'Approved share card is up to date.'
          else
            git commit -m 'Regenerate approved FFTT social share card'
            git push
          fi
