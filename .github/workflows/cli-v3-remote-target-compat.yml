name: Supabase CLI v3 remote-target safety probe (disposable only)

on:
  pull_request:
    paths:
      - .github/workflows/cli-v3-remote-target-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-target:
    name: Explicit remote flags and migration workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact tested CLI v3
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Exercise remote path against isolated second local Postgres database
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          supabase --version
          supabase init --yes
          supabase start
          export PGPASSWORD=postgres
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "CREATE DATABASE cli_v3_remote_fixture;"
          url="postgresql://postgres:postgres@127.0.0.1:54322/cli_v3_remote_fixture"
          supabase migration new remote_target_probe
          migration="$(find supabase/migrations -name '*_remote_target_probe.sql' -print -quit)"
          test -n "$migration"
          version="$(basename "$migration" | cut -d_ -f1)"
          cat > "$migration" <<'SQL'
          create table public.v3_remote_target_probe(id integer primary key);
          SQL

          echo "Dry-run must not modify the disposable remote-target database."
          supabase db push --dry-run --remote="$url"
          before="$(psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d cli_v3_remote_fixture -c "select to_regclass('public.v3_remote_target_probe') is null")"
          test "$before" = t

          echo "Explicit --remote plus --yes must apply ONLY to the second disposable database."
          supabase db push --yes --remote="$url"
          remote="$(psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d cli_v3_remote_fixture -c "select to_regclass('public.v3_remote_target_probe') is not null")"
          local="$(psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "select to_regclass('public.v3_remote_target_probe') is null")"
          test "$remote" = t
          test "$local" = t

          history="$(psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d cli_v3_remote_fixture -c "select count(*) from supabase_migrations.schema_migrations where version='$version'")"
          test "$history" = 1

          echo "Read-only remote migration listing must work."
          supabase migration list --remote="$url"

          echo "Explicit remote database dump must include only the fixture schema."
          supabase db dump -f "$workdir/remote-schema.sql" --remote="$url"
          grep -q 'v3_remote_target_probe' "$workdir/remote-schema.sql"

          echo "PASS: dry-run no-op, explicit remote push with confirmation, correct target, recorded migration, remote migration list, and remote schema dump."
