name: B2h password-free hosted signed Auth probe guards

on:
  pull_request:
    paths:
      - tests/b2h_admin_magiclink_signed_auth.py
      - tests/test_b2h_admin_magiclink_signed_auth.py
      - docs/PHASE1B_B2H_PASSWORDLESS_SIGNED_AUTH.md
      - .github/workflows/b2h-passwordless-auth-guards.yml
  workflow_dispatch:

jobs:
  no-hosted-network-no-credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax without accessing hosted Supabase
        run: |
          python -m py_compile tests/b2h_admin_magiclink_signed_auth.py tests/test_b2h_admin_magiclink_signed_auth.py
      - name: Mock Auth generate_link token exchange and fail-closed access checks
        run: python -m unittest discover -s tests -p 'test_b2h_admin_magiclink_signed_auth.py' -v
