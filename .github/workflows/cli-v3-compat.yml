name: Supabase CLI v3 FFTT synthetic compatibility (test only)

on:
  pull_request:
    paths:
      - .github/workflows/cli-v3-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-db:
    name: Disposable synthetic PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Supabase CLI (local only)
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Check CLI version and port before local startup
        run: |
          supabase --version
          echo 'Local port 54322 before start:'
          (sudo ss -ltnp | grep ':54322' || true)
          echo 'Existing Docker containers:'
          docker ps --format '{{.Names}} {{.Ports}}'
      - name: Start isolated local Supabase PostgreSQL and GoTrue (no remote link)
        run: supabase start
      - name: Verify existing B1-B2d migrations before v2
        run: supabase test db
      - name: Apply v2 candidate ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/MILESTONE1_DURABLE_SCORING_V2_DO_NOT_APPLY.sql
      - name: Assert real PostgreSQL accepted/rejected receipt and revocation behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/milestone1_v2_disposable.sql
      - name: Verify independently signed local Auth and simultaneous V2 HTTP score race
        run: |
          python -m py_compile tests/milestone1_v2_signed_http.py
          python tests/milestone1_v2_signed_http.py
      - name: Apply game-day V3 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V3_STAGING.sql
      - name: Assert game-day V3 privileges (anon/authenticated/private helpers)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v3_disposable.sql
      - name: Verify a whole fictional tournament over real local Auth with concurrent scorekeepers
        run: |
          python -m py_compile tests/gameday_signed_http.py
          python tests/gameday_signed_http.py
      - name: Apply game-day V4 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V4_STAGING.sql
      - name: Assert game-day V4 privileges and structure (anon/authenticated/private helpers/contact columns/Bo5)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v4_disposable.sql
      - name: Verify V4 formats, registration, restore and guarded deletion over real local Auth with concurrent scorekeepers
        run: |
          python -m py_compile tests/gameday_v4_signed_http.py
          python tests/gameday_v4_signed_http.py
      - name: Apply game-day V5 ONLY to ephemeral local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/proposals/GAMEDAY_TOURNAMENT_V5_STAGING.sql
      - name: Independently test real-only candidate on disposable local PostgreSQL (fictional users only)
        env:
          PGPASSWORD: postgres
        run: bash tests/gameday_real_candidate_postgres.sh
      - name: Validate in-place real-event launch upgrade on populated local PostgreSQL (no hosted change)
        env:
          PGPASSWORD: postgres
        run: bash tests/gameday_single_project_postgres.sh
      - name: Assert game-day V5 privileges and structure (anon/authenticated/helpers/no private data/synthetic rule)
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f tests/gameday_v5_disposable.sql
      - name: Apply source-pinned single-project launch candidate to disposable local Supabase only
        env:
          PGPASSWORD: postgres
        run: |
          candidate="$(mktemp)"
          rm -f "$candidate"
          trap 'rm -f "$candidate"' EXIT
          python3 tools/release/build_single_project_upgrade.py --out "$candidate"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "$candidate" >/dev/null
      - name: Verify real-mode event with independent local signed Auth, two scorer race and private registration
        run: |
          python -m py_compile tests/fftt3_launch_signed_http.py
          python tests/fftt3_launch_signed_http.py
