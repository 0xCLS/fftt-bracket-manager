name: FFTT fast checks

# One focused pass per PR head. No push-to-main replay and NO automatic full regression.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'For a manual focused check, enter the trusted base commit SHA'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: fftt-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: CI v2 — select targeted suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      manual: ${{ steps.plan.outputs.manual }}
      needs_modules: ${{ steps.plan.outputs.needs_modules }}
      needs_browser: ${{ steps.plan.outputs.needs_browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use routing policy from trusted base (not the PR being checked)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test "$BASE_SHA" != ''
          git show "$BASE_SHA:tools/ci_v2.py" > "$RUNNER_TEMP/ci_v2.py" || {
            echo 'Trusted base lacks CI v2; initial adoption needs explicit approval, no full run dispatched.' >&2
            exit 1
          }
      - name: Select cumulative PR-impact suites
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FFTT_CI_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/ci_v2.py" plan --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  focused:
    name: CI v2 — focused verification
    needs: select
    if: needs.select.outputs.lanes != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install test-only dependencies once
        if: needs.select.outputs.needs_modules == 'true'
        working-directory: tests/e2e
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium only for browser suites
        if: needs.select.outputs.needs_browser == 'true'
        working-directory: tests/e2e
        run: npx playwright-core install chromium
      - name: Execute selected tests, deduplicated
        env:
          LANES: ${{ needs.select.outputs.lanes }}
        run: python3 tools/ci_v2.py run --lanes "$LANES"

  authorization:
    name: CI v2 — release-risk gate
    if: always()
    needs: [select, focused]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require successful selection and focused checks
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          LANES: ${{ needs.select.outputs.lanes }}
        run: |
          test "$SELECT_RESULT" = success || { echo 'CI selection did not pass'; exit 1; }
          if [ "$LANES" != none ]; then
            test "$FOCUSED_RESULT" = success || { echo 'Focused verification did not pass'; exit 1; }
          fi
      - uses: actions/checkout@v4
        if: needs.select.outputs.manual == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Recover approved manual-proof verifier from trusted base
        if: needs.select.outputs.manual == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: git show "$BASE_SHA:tools/ci_v2.py" > "$RUNNER_TEMP/ci_v2.py"
      - name: Verify owner-authorized comprehensive proof for high-risk changes
        if: needs.select.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo 'High-risk diff: manual comprehensive verification must exist for exact head SHA.'
          python3 "$RUNNER_TEMP/ci_v2.py" verify-manual --head "$HEAD_SHA"
