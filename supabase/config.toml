# Synthetic-only local/CI database. No project URL, keys, user data or secrets.
# This is NOT a linked remote Supabase project.
project_id = "fftt-bracket-manager-synthetic"

[api]
schemas = ["public", "graphql_public"]

[db.seed]
enabled = false

# B2c local-only signed Auth integration: disposable synthetic users must be
# able to sign in without a real email inbox. Hosted Auth is NOT modified.
[auth.email]
enable_confirmations = false
# Local-only settings for tests/staff_invite_resend_local_auth.mjs (fictional users, disposable stack; hosted Auth is NOT modified):
# the Staff invitation callback must be on the redirect allow-list for redirect_to to be honoured, a replacement
# invitation is allowed after one second, and the per-hour email cap is raised above the default of 2.
max_frequency = "1s"

[auth]
additional_redirect_urls = ["https://fftt-staff.clslifestyle.com/app/staff-invite.html"]

[auth.rate_limit]
email_sent = 30
